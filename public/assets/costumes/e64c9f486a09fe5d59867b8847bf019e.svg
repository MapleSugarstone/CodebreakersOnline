<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="219.5" height="161.56201" viewBox="0,0,219.5,161.56201"><defs><style>@font-face {font-family: "Sans Serif";src: url("cbfont:a1724f07a3ac");}</style></defs><g><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M 0.75 160.812 L 0.75 0.812 L 218.75 0.812 L 218.75 160.812 Z" fill="#e2e2e2" stroke="#000000" stroke-width="1.5"/><text transform="matrix(0.22568,0,0,0.22568,2,9.817080000000004)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Now... moving on!</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">See that cube over there? It's been in every</tspan><tspan x="0" dy="46.150000000000006px">platformer on Scratch and now it's trying to</tspan><tspan x="0" dy="46.150000000000006px">spread into codebreakers!</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">They seem pretty docile, but they're secretly a</tspan><tspan x="0" dy="46.150000000000006px">menace to society! Probably.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Press [n] and [m] to use your regular and special</tspan><tspan x="0" dy="46.150000000000006px">fighting moves. You have unique regulars in</tspan><tspan x="0" dy="46.150000000000006px">the air AND when you press [down]. You have a</tspan><tspan x="0" dy="46.150000000000006px">unique special if you press [down] too.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Go beat em up!</tspan></text><text transform="matrix(0.22568,0,0,0.22568,206,156.81707999999998)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">[n]</tspan></text></g></g></svg>